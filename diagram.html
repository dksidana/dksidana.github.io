<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Graph Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .graph-container {
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        .node {
            cursor: pointer;
        }
        .node rect {
            stroke-width: 1.5px;
            stroke: #333;
            transition: fill 0.2s ease, stroke 0.2s ease;
        }
        .node text {
            font-size: 14px;
            font-weight: 500;
            pointer-events: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        .subgraph rect {
            stroke-dasharray: 5, 5;
            stroke-width: 2px;
            fill-opacity: 0.1;
        }
        .subgraph-header {
            cursor: pointer;
        }
        .subgraph-header text {
            font-weight: 600;
            font-size: 16px;
        }
        .link {
            stroke: #666;
            stroke-width: 2px;
            stroke-opacity: 0.7;
        }
        .link-arrow {
            fill: #666;
            fill-opacity: 0.7;
        }
        .editor-panel {
            height: calc(100vh - 4rem); /* Adjust for header height */
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="flex flex-col h-screen">
        <!-- Header -->
        <header class="bg-white shadow-md z-10">
            <div class="container mx-auto px-4 py-3 flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-800">Interactive Graph Editor</h1>
                <button id="renderBtn" class="px-6 py-2 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-opacity-75 transition-colors">
                    Render
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="flex flex-1 overflow-hidden">
            <!-- Editor Panel -->
            <div class="w-1/3 bg-gray-50 p-4 shadow-lg">
                <h2 class="text-lg font-semibold mb-2 text-gray-700">Graph Definition</h2>
                <textarea id="editor" class="w-full editor-panel border border-gray-300 rounded-lg p-3 text-sm font-mono bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none" spellcheck="false">
# Define nodes with ID and label
nodeA[API Gateway]
nodeB[Auth Service]
nodeC[User Service]
nodeD[Product Service]

# Define links between nodes
nodeA --> nodeB
nodeA --> nodeC
nodeA --> nodeD

# Define a subgraph
subgraph Core Services {
  nodeE[Database]
  nodeF[Cache]
  nodeC --> nodeE
  nodeD --> nodeE
  nodeE --> nodeF
}

# Link external nodes to subgraph nodes
nodeB --> nodeE
                </textarea>
            </div>

            <!-- Graph Panel -->
            <div class="w-2/3 bg-gray-200" id="graph-wrapper">
                <svg id="graph" class="graph-container"></svg>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const editor = document.getElementById('editor');
            const renderBtn = document.getElementById('renderBtn');
            const graphWrapper = document.getElementById('graph-wrapper');
            let svg, simulation, g;
            let currentNodes = [], currentLinks = [];

            // --- Parser ---
            function parseInput(text) {
                const lines = text.split('\n').filter(line => line.trim() !== '' && !line.trim().startsWith('#'));
                const nodes = [];
                const links = [];
                const nodeMap = new Map();
                let currentSubgraph = null;

                lines.forEach(line => {
                    line = line.trim();

                    // Subgraph start
                    if (line.startsWith('subgraph')) {
                        const match = line.match(/subgraph\s+([^{]+){/);
                        if (match) {
                            const id = 'subgraph_' + match[1].trim().replace(/\s/g, '_');
                            currentSubgraph = { 
                                id: id, 
                                label: match[1].trim(), 
                                isSubgraph: true, 
                                isMinimized: false,
                                children: new Set()
                            };
                            if (!nodeMap.has(id)) {
                                nodes.push(currentSubgraph);
                                nodeMap.set(id, currentSubgraph);
                            }
                        }
                        return;
                    }
                    
                    // Subgraph end
                    if (line.startsWith('}')) {
                        currentSubgraph = null;
                        return;
                    }

                    // Link definition
                    const linkMatch = line.match(/(\w+)\s*-->\s*(\w+)/);
                    if (linkMatch) {
                        links.push({ source: linkMatch[1], target: linkMatch[2] });
                        return;
                    }

                    // Node definition
                    const nodeMatch = line.match(/(\w+)\[([^\]]+)\]/);
                    if (nodeMatch) {
                        const id = nodeMatch[1];
                        const label = nodeMatch[2];
                        const node = { id, label };
                        if (currentSubgraph) {
                            node.parent = currentSubgraph.id;
                            currentSubgraph.children.add(id);
                        }
                        if (!nodeMap.has(id)) {
                            nodes.push(node);
                            nodeMap.set(id, node);
                        }
                    }
                });

                // Convert children set to array for easier use later
                nodes.forEach(n => {
                    if (n.isSubgraph) n.children = Array.from(n.children);
                });

                return { nodes, links };
            }

            // --- D3 Rendering ---
            function initializeGraph() {
                const width = graphWrapper.clientWidth;
                const height = graphWrapper.clientHeight;

                d3.select("#graph").selectAll("*").remove();
                
                svg = d3.select("#graph")
                    .attr("viewBox", [-width / 2, -height / 2, width, height]);

                g = svg.append("g");
                
                const zoom = d3.zoom()
                    .scaleExtent([0.1, 4])
                    .on("zoom", (event) => {
                        g.attr("transform", event.transform);
                    });
                
                svg.call(zoom);

                simulation = d3.forceSimulation()
                    .force("link", d3.forceLink().id(d => d.id).distance(150))
                    .force("charge", d3.forceManyBody().strength(-400))
                    .force("collide", d3.forceCollide().radius(d => d.isSubgraph ? 150 : 70))
                    .on("tick", ticked);
            }

            function updateGraph() {
                const { nodes: parsedNodes, links: parsedLinks } = parseInput(editor.value);
                currentNodes = parsedNodes;
                currentLinks = parsedLinks;
                
                render();
            }

            function render() {
                // Filter nodes and links based on minimized subgraphs
                const minimizedParents = new Set(currentNodes.filter(n => n.isSubgraph && n.isMinimized).map(n => n.id));
                const visibleNodes = currentNodes.filter(n => !n.parent || !minimizedParents.has(n.parent));
                const visibleNodeIds = new Set(visibleNodes.map(n => n.id));
                const visibleLinks = currentLinks.filter(l => visibleNodeIds.has(l.source) && visibleNodeIds.has(l.target));

                g.selectAll("*").remove();

                // Arrowhead marker
                g.append("defs").append("marker")
                    .attr("id", "arrowhead")
                    .attr("viewBox", "-0 -5 10 10")
                    .attr("refX", 23)
                    .attr("refY", 0)
                    .attr("orient", "auto")
                    .attr("markerWidth", 8)
                    .attr("markerHeight", 8)
                    .attr("xoverflow", "visible")
                    .append("svg:path")
                    .attr("d", "M 0,-5 L 10 ,0 L 0,5")
                    .attr("class", "link-arrow");

                // Links
                const link = g.append("g")
                    .selectAll("path")
                    .data(visibleLinks)
                    .join("path")
                    .attr("class", "link")
                    .attr("marker-end", "url(#arrowhead)");

                // Subgraph containers
                const subgraph = g.append("g")
                    .selectAll("g")
                    .data(visibleNodes.filter(d => d.isSubgraph))
                    .join("g")
                    .attr("class", "subgraph");

                // Nodes
                const node = g.append("g")
                    .selectAll("g")
                    .data(visibleNodes.filter(d => !d.isSubgraph))
                    .join("g")
                    .attr("class", "node")
                    .call(drag(simulation));

                // Add visual elements to nodes
                node.append("rect")
                    .attr("width", 160)
                    .attr("height", 50)
                    .attr("rx", 8)
                    .attr("ry", 8)
                    .attr("fill", "#fff")
                    .attr("stroke", d => d.parent ? "#3b82f6" : "#6b7280");
                
                node.append("text")
                    .text(d => d.label)
                    .attr("x", 80)
                    .attr("y", 25)
                    .attr("text-anchor", "middle")
                    .attr("dominant-baseline", "central")
                    .attr("fill", "#1f2937");
                
                // Add visual elements to subgraphs
                const subgraphHeader = subgraph.append("g")
                    .attr("class", "subgraph-header")
                    .on("click", (event, d) => toggleSubgraph(d));
                
                subgraphHeader.append("text")
                    .text(d => `${d.isMinimized ? '[+]' : '[-]'} ${d.label}`)
                    .attr("x", 10)
                    .attr("y", 20)
                    .attr("fill", "#4b5563");
                
                subgraph.insert("rect", ":first-child")
                    .attr("fill", "#e5e7eb")
                    .attr("stroke", "#9ca3af")
                    .attr("rx", 15)
                    .attr("ry", 15);

                simulation.nodes(visibleNodes);
                simulation.force("link").links(visibleLinks);
                simulation.alpha(1).restart();
            }

            function ticked() {
                // Update link paths
                g.selectAll(".link")
                    .attr("d", d => `M${d.source.x},${d.source.y} L${d.target.x},${d.target.y}`);

                // Update node positions
                g.selectAll(".node")
                    .attr("transform", d => `translate(${d.x - 80}, ${d.y - 25})`);
                
                // Update subgraph positions and sizes
                g.selectAll(".subgraph").each(function(d) {
                    if (d.isMinimized) {
                        d3.select(this).select("rect")
                            .attr("x", d.x - 100).attr("y", d.y - 25)
                            .attr("width", 200).attr("height", 50);
                        d3.select(this).select(".subgraph-header")
                            .attr("transform", `translate(${d.x - 90}, ${d.y - 5})`);
                        return;
                    }
                    
                    const childNodes = currentNodes.filter(n => n.parent === d.id);
                    if (childNodes.length === 0) {
                        d3.select(this).select("rect")
                            .attr("x", d.x - 100).attr("y", d.y - 25)
                            .attr("width", 200).attr("height", 50);
                        d3.select(this).select(".subgraph-header")
                            .attr("transform", `translate(${d.x - 90}, ${d.y - 5})`);
                        return;
                    };

                    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                    childNodes.forEach(n => {
                        minX = Math.min(minX, n.x - 80);
                        maxX = Math.max(maxX, n.x + 80);
                        minY = Math.min(minY, n.y - 25);
                        maxY = Math.max(maxY, n.y + 25);
                    });
                    const padding = 30;
                    d3.select(this).select("rect")
                        .attr("x", minX - padding)
                        .attr("y", minY - padding - 20) // extra padding for header
                        .attr("width", maxX - minX + 2 * padding)
                        .attr("height", maxY - minY + 2 * padding + 20);
                    
                    d3.select(this).select(".subgraph-header")
                        .attr("transform", `translate(${minX - padding + 10}, ${minY - padding - 10})`);
                });
            }

            function drag(simulation) {
                function dragstarted(event, d) {
                    if (!event.active) simulation.alphaTarget(0.3).restart();
                    d.fx = d.x;
                    d.fy = d.y;
                }
                function dragged(event, d) {
                    d.fx = event.x;
                    d.fy = event.y;
                }
                function dragended(event, d) {
                    if (!event.active) simulation.alphaTarget(0);
                    d.fx = null;
                    d.fy = null;
                }
                return d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended);
            }
            
            function toggleSubgraph(d) {
                const subgraphNode = currentNodes.find(n => n.id === d.id);
                if (subgraphNode) {
                    subgraphNode.isMinimized = !subgraphNode.isMinimized;
                    render(); // Re-render the graph with the new state
                }
            }

            // --- Event Listeners ---
            renderBtn.addEventListener('click', updateGraph);
            
            // Initial render
            initializeGraph();
            updateGraph();

            // Resize handler
            window.addEventListener('resize', () => {
                initializeGraph();
                updateGraph();
            });
        });
    </script>
</body>
</html>
