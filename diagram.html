<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Graph Editor (Enhanced Syntax)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .graph-container {
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        .node {
            cursor: pointer;
        }
        .node .shape {
            stroke-width: 1.5px;
            stroke: #333;
            transition: fill 0.2s ease, stroke 0.2s ease;
            fill: #fff;
        }
        .node text {
            font-size: 14px;
            font-weight: 500;
            pointer-events: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            fill: #1f2937;
        }
        .subgraph rect {
            stroke-dasharray: 5, 5;
            stroke-width: 2px;
            fill-opacity: 0.1;
            fill: #e5e7eb;
            stroke: #9ca3af;
        }
        .subgraph-header {
            cursor: pointer;
        }
        .subgraph-header text {
            font-weight: 600;
            font-size: 16px;
            fill: #4b5563;
        }
        .link {
            stroke-opacity: 0.7;
        }
        .link-label {
            font-size: 12px;
            fill: #374151;
            text-anchor: middle;
            dominant-baseline: middle;
            paint-order: stroke;
            stroke: #f9fafb;
            stroke-width: 3px;
            stroke-linecap: butt;
            stroke-linejoin: miter;
        }
        .link-arrow {
            fill-opacity: 0.7;
        }
        .editor-panel {
            height: calc(100vh - 4rem); /* Adjust for header height */
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="flex flex-col h-screen">
        <!-- Header -->
        <header class="bg-white shadow-md z-10">
            <div class="container mx-auto px-4 py-3 flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-800">Interactive Graph Editor</h1>
                <button id="renderBtn" class="px-6 py-2 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-opacity-75 transition-colors">
                    Render
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="flex flex-1 overflow-hidden">
            <!-- Editor Panel -->
            <div class="w-1/3 bg-gray-50 p-4 shadow-lg">
                <h2 class="text-lg font-semibold mb-2 text-gray-700">Graph Definition</h2>
                <textarea id="editor" class="w-full editor-panel border border-gray-300 rounded-lg p-3 text-sm font-mono bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none" spellcheck="false">
# Different node shapes
A[Rectangle]
B(Rounded Rectangle)
C((Circle))
D{Rhombus}
E[(Database)]

# Different link types
A -- text --- B
B --> C
C -.-> D
D ==> E

# Subgraph with alternative syntax
subgraph Core Services
  db[(Database)]
  cache(Cache)
  db -- Replicates to --> cache
end

# Links between subgraphs and nodes
A -- Authenticates with --> db
E -. "Reads from" .-> db
                </textarea>
            </div>

            <!-- Graph Panel -->
            <div class="w-2/3 bg-gray-200" id="graph-wrapper">
                <svg id="graph" class="graph-container"></svg>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const editor = document.getElementById('editor');
            const renderBtn = document.getElementById('renderBtn');
            const graphWrapper = document.getElementById('graph-wrapper');
            let svg, simulation, g;
            let currentNodes = [], currentLinks = [];
            const NODE_WIDTH = 160;
            const NODE_HEIGHT = 50;

            // --- Parser ---
            function parseInput(text) {
                const lines = text.split('\n').filter(line => line.trim() !== '' && !line.trim().startsWith('#'));
                const nodes = [];
                const links = [];
                const nodeMap = new Map();
                let currentSubgraph = null;
                let inSubgraph = false;

                lines.forEach(line => {
                    line = line.trim();

                    // Subgraph start (Mermaid 'subgraph...end' syntax)
                    if (line.startsWith('subgraph') && !line.includes('{')) {
                        const title = line.substring('subgraph'.length).trim();
                        const id = 'subgraph_' + title.replace(/\s/g, '_');
                        currentSubgraph = { id, label: title, isSubgraph: true, isMinimized: false, children: new Set() };
                        if (!nodeMap.has(id)) {
                            nodes.push(currentSubgraph);
                            nodeMap.set(id, currentSubgraph);
                        }
                        inSubgraph = true;
                        return;
                    }
                    
                    // Subgraph end
                    if (line.startsWith('end') && inSubgraph) {
                        currentSubgraph = null;
                        inSubgraph = false;
                        return;
                    }

                    // Link definition
                    const linkMatch = line.match(/(\w+)\s*(-[.-]?-|==)\s*(?:(?:\[([^\]]+)\])|(?:"([^"]+)")|(\w+))?\s*(-[.-]?-?>|==>)\s*(\w+)/) || line.match(/(\w+)\s*(-->|---|--)\s*(\w+)/);
                    if (linkMatch) {
                        const [ , source, linkStyle1, label1, label2, label3, linkStyle2, target] = linkMatch;
                        const label = label1 || label2 || label3 || '';
                        const fullLinkStyle = (linkStyle1 || '') + (linkStyle2 || '');
                        
                        let style = 'solid';
                        if(fullLinkStyle.includes('-.')) style = 'dotted';
                        if(fullLinkStyle.includes('==')) style = 'thick';

                        let arrowhead = 'none';
                        if(fullLinkStyle.endsWith('>')) arrowhead = 'end';
                        
                        links.push({ source: source || linkMatch[1], target: target || linkMatch[3], label, style, arrowhead });
                        return;
                    }

                    // Node definition
                    const nodeMatch = line.match(/^(\w+)(?:\[([^\]]+)\]|\(\(([^)]+))\)\)|\(([^)]+)\)|{([^}]+)}|\(\[([^\]]+)\]\))/);
                    if (nodeMatch) {
                        const id = nodeMatch[1];
                        let label = '';
                        let shape = 'rect'; // default
                        if (nodeMatch[2] !== undefined) { label = nodeMatch[2]; shape = 'rect'; }
                        else if (nodeMatch[3] !== undefined) { label = nodeMatch[3]; shape = 'circle'; }
                        else if (nodeMatch[4] !== undefined) { label = nodeMatch[4]; shape = 'rounded-rect'; }
                        else if (nodeMatch[5] !== undefined) { label = nodeMatch[5]; shape = 'rhombus'; }
                        else if (nodeMatch[6] !== undefined) { label = nodeMatch[6]; shape = 'database'; }
                        
                        const node = { id, label, shape };
                        if (currentSubgraph) {
                            node.parent = currentSubgraph.id;
                            currentSubgraph.children.add(id);
                        }
                        if (!nodeMap.has(id)) {
                            nodes.push(node);
                            nodeMap.set(id, node);
                        }
                    }
                });

                nodes.forEach(n => {
                    if (n.isSubgraph) n.children = Array.from(n.children);
                });

                return { nodes, links };
            }

            // --- D3 Rendering ---
            function initializeGraph() {
                const width = graphWrapper.clientWidth;
                const height = graphWrapper.clientHeight;

                d3.select("#graph").selectAll("*").remove();
                
                svg = d3.select("#graph").attr("viewBox", [-width / 2, -height / 2, width, height]);
                g = svg.append("g");
                
                const zoom = d3.zoom().scaleExtent([0.1, 4]).on("zoom", (event) => g.attr("transform", event.transform));
                svg.call(zoom);

                simulation = d3.forceSimulation()
                    .force("link", d3.forceLink().id(d => d.id).distance(200))
                    .force("charge", d3.forceManyBody().strength(-600))
                    .force("collide", d3.forceCollide().radius(d => d.isSubgraph ? 150 : 80))
                    .on("tick", ticked);
            }

            function render() {
                const { nodes: parsedNodes, links: parsedLinks } = parseInput(editor.value);
                currentNodes = parsedNodes;
                currentLinks = parsedLinks;

                const minimizedParents = new Set(currentNodes.filter(n => n.isSubgraph && n.isMinimized).map(n => n.id));
                const visibleNodes = currentNodes.filter(n => !n.parent || !minimizedParents.has(n.parent));
                const visibleNodeIds = new Set(visibleNodes.map(n => n.id));
                const visibleLinks = currentLinks.filter(l => visibleNodeIds.has(l.source) && visibleNodeIds.has(l.target));

                g.selectAll("*").remove();

                // Arrowhead marker
                g.append("defs").append("marker")
                    .attr("id", "arrowhead")
                    .attr("viewBox", "-0 -5 10 10").attr("refX", 10).attr("refY", 0)
                    .attr("orient", "auto").attr("markerWidth", 8).attr("markerHeight", 8)
                    .append("svg:path").attr("d", "M 0,-5 L 10 ,0 L 0,5").attr("class", "link-arrow").style("fill", "#666");

                // Links
                const link = g.append("g").selectAll("path.link")
                    .data(visibleLinks).join("path")
                    .attr("class", "link")
                    .attr("stroke", "#666")
                    .attr("stroke-width", d => d.style === 'thick' ? 4 : 2)
                    .attr("stroke-dasharray", d => d.style === 'dotted' ? "5,5" : "none")
                    .attr("marker-end", d => d.arrowhead === 'end' ? "url(#arrowhead)" : "none");

                // Link labels
                const linkLabel = g.append("g").selectAll("text.link-label")
                    .data(visibleLinks.filter(l => l.label)).join("text")
                    .attr("class", "link-label")
                    .text(d => d.label);

                // Subgraphs
                const subgraph = g.append("g").selectAll("g.subgraph")
                    .data(visibleNodes.filter(d => d.isSubgraph)).join("g")
                    .attr("class", "subgraph");

                // Nodes
                const node = g.append("g").selectAll("g.node")
                    .data(visibleNodes.filter(d => !d.isSubgraph)).join("g")
                    .attr("class", "node").call(drag(simulation));

                // Add visual elements to nodes based on shape
                node.each(function(d) {
                    const group = d3.select(this);
                    group.selectAll("*").remove(); // Clear previous shapes
                    const w = NODE_WIDTH;
                    const h = NODE_HEIGHT;
                    switch (d.shape) {
                        case 'circle':
                            group.append('circle').attr('r', h / 2 + 10).attr('class', 'shape');
                            break;
                        case 'rhombus':
                            group.append('path').attr('d', `M 0 ${h/2} L ${w/2} 0 L ${w} ${h/2} L ${w/2} ${h} Z`).attr('class', 'shape');
                            break;
                        case 'database':
                            group.append('path').attr('d', `M 0 ${h*0.2} C 0 ${-h*0.2}, ${w} ${-h*0.2}, ${w} ${h*0.2} V ${h*0.8} C ${w} ${h*1.2}, 0 ${h*1.2}, 0 ${h*0.8} Z M 0 ${h*0.2} C 0 ${-h*0.2}, ${w} ${-h*0.2}, ${w} ${h*0.2}`).attr('class', 'shape');
                            break;
                        case 'rounded-rect':
                             group.append('rect').attr('width', w).attr('height', h).attr('rx', h / 2).attr('ry', h / 2).attr('class', 'shape');
                             break;
                        default: // rect
                            group.append('rect').attr('width', w).attr('height', h).attr('rx', 8).attr('ry', 8).attr('class', 'shape');
                    }
                     group.select('.shape').attr("stroke", d.parent ? "#3b82f6" : "#6b7280");
                     group.append('text').text(d.label).attr('x', w/2).attr('y', h/2).attr('text-anchor', 'middle').attr('dominant-baseline', 'central');
                });
                
                // Add visual elements to subgraphs
                const subgraphHeader = subgraph.append("g").attr("class", "subgraph-header").on("click", (event, d) => toggleSubgraph(d));
                subgraphHeader.append("text").text(d => `${d.isMinimized ? '[+]' : '[-]'} ${d.label}`).attr("x", 10).attr("y", 20);
                subgraph.insert("rect", ":first-child").attr("rx", 15).attr("ry", 15);

                simulation.nodes(visibleNodes);
                simulation.force("link").links(visibleLinks);
                simulation.alpha(1).restart();
            }

            function ticked() {
                 g.selectAll(".link").attr("d", d => {
                    // Adjust path to not overlap node shape
                    const dx = d.target.x - d.source.x;
                    const dy = d.target.y - d.source.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist === 0) return '';
                    const offsetX = (dx * (NODE_WIDTH / 2 + 5)) / dist;
                    const offsetY = (dy * (NODE_HEIGHT / 2 + 5)) / dist;
                    return `M${d.source.x + offsetX},${d.source.y + offsetY} L${d.target.x - offsetX},${d.target.y - offsetY}`;
                });

                g.selectAll(".link-label").attr("x", d => (d.source.x + d.target.x) / 2).attr("y", d => (d.source.y + d.target.y) / 2);

                g.selectAll(".node").attr("transform", d => `translate(${d.x - NODE_WIDTH/2}, ${d.y - NODE_HEIGHT/2})`);
                
                g.selectAll(".subgraph").each(function(d) {
                    if (d.isMinimized) {
                        d3.select(this).select("rect").attr("x", d.x - 100).attr("y", d.y - 25).attr("width", 200).attr("height", 50);
                        d3.select(this).select(".subgraph-header").attr("transform", `translate(${d.x - 90}, ${d.y - 5})`);
                        return;
                    }
                    const childNodes = currentNodes.filter(n => n.parent === d.id);
                    if (childNodes.length === 0) return;
                    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                    childNodes.forEach(n => {
                        minX = Math.min(minX, n.x - NODE_WIDTH/2); maxX = Math.max(maxX, n.x + NODE_WIDTH/2);
                        minY = Math.min(minY, n.y - NODE_HEIGHT/2); maxY = Math.max(maxY, n.y + NODE_HEIGHT/2);
                    });
                    const padding = 30;
                    d3.select(this).select("rect").attr("x", minX - padding).attr("y", minY - padding - 20).attr("width", maxX - minX + 2 * padding).attr("height", maxY - minY + 2 * padding + 20);
                    d3.select(this).select(".subgraph-header").attr("transform", `translate(${minX - padding + 10}, ${minY - padding - 10})`);
                });
            }

            function drag(simulation) {
                function dragstarted(event, d) { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
                function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
                function dragended(event, d) { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }
                return d3.drag().on("start", dragstarted).on("drag", dragged).on("end", dragended);
            }
            
            function toggleSubgraph(d) {
                const subgraphNode = currentNodes.find(n => n.id === d.id);
                if (subgraphNode) {
                    subgraphNode.isMinimized = !subgraphNode.isMinimized;
                    render();
                }
            }

            // --- Init ---
            renderBtn.addEventListener('click', render);
            window.addEventListener('resize', () => { initializeGraph(); render(); });
            initializeGraph();
            render();
        });
    </script>
</body>
</html>
